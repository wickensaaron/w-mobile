workflows:
  sidestore_ipa:
    name: W Media Player SideStore IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      java: 17
      groups:
        - w_media_public
      vars:
        IOS_CONFIGURATION: Release
        NUVIO_SUPABASE_URL: https://mclzacllioaczhrjdehv.supabase.co
        NUVIO_GRADLE_JVMARGS: -Xmx4608M -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=768M
        NUVIO_KOTLIN_NATIVE_JVMARGS: -Xmx4608M
        NUVIO_GRADLE_EXPECTED_HEAP_MB: 4608
        NUVIO_GRADLE_MAX_WORKERS: 1
    scripts:
      - name: Check public Supabase configuration
        script: |
          if [ -e local.properties ]; then
            echo "The Codemagic IPA checkout must use public environment configuration, without local.properties overrides." >&2
            exit 1
          fi
          bash ./scripts/check-ios-runtime-config.sh
      - name: Prepare iOS dependencies
        script: ./scripts/prepare-ios-dependencies.sh
      - name: Build unsigned SideStore IPA
        script: ./scripts/build-ios-ipa.sh
    artifacts:
      - build/ios-ipa/*.ipa
      - build/ios-ipa/*-build.log
      - build/ios-ipa/*-build-info.txt
      - build/ios-ipa/*.ipa.sha256
      - /tmp/xcodebuild_logs/*.log
